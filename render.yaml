services:
  - type: web
    name: timebox-youtube-blocker-home
    runtime: node
    buildCommand: npm ci && npm run prepare:downloads
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: license-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_PRICE_CENTS
        value: 500
      - key: DATA_DIR
        value: /opt/render/project/src/storage
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
